# 非默认端口：后端 8081、MySQL 3307；均可用 PowerShell 环境变量覆盖
server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    url: 'jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/acgn_screenroom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
